<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Kavinprasanth KM</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030305;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    /* Animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, rgba(34, 211, 238, 0.06) 0%, transparent 50%);
      animation: pulse 8s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
    }

    .code {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #60a5fa, #22d3ee, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: clamp(0.8rem, 2vw, 1rem);
      color: #a1a1aa;
      font-weight: 300;
      margin-bottom: 2.5rem;
      max-width: 400px;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 9999px;
      background: #fff;
      color: #030305;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration: none;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: rgba(34, 211, 238, 0.3);
      border-radius: 50%;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Floating particles -->
  <div class="particle" style="left:10%;animation-duration:12s;animation-delay:0s;"></div>
  <div class="particle" style="left:25%;animation-duration:18s;animation-delay:2s;"></div>
  <div class="particle" style="left:40%;animation-duration:15s;animation-delay:4s;"></div>
  <div class="particle" style="left:55%;animation-duration:20s;animation-delay:1s;"></div>
  <div class="particle" style="left:70%;animation-duration:14s;animation-delay:3s;"></div>
  <div class="particle" style="left:85%;animation-duration:16s;animation-delay:5s;"></div>
  <div class="particle" style="left:50%;animation-duration:22s;animation-delay:0.5s;"></div>
  <div class="particle" style="left:15%;animation-duration:19s;animation-delay:6s;"></div>

  <div class="container">
    <div class="code">404</div>
    <h1 class="title">Lost in the void</h1>
    <p class="subtitle">The page you're looking for has drifted into deep space. Let's get you back on track.</p>
    <a href="/" class="btn">← Back to Portfolio</a>
  </div>
</body>
</html>
